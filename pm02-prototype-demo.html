let DATA = [];
let cur = null;         // 当前选中 id
let filter = 'all';
let todayFollow = [];   // 今日跟进
let takeovers = 0;      // 已接手计数
let timer = null;

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const riskTxt = r => r===3 ? '风险 3 级' : r===2 ? '风险 2 级' : '风险 1 级';
const riskCls = r => r===3 ? 't3' : r===2 ? 't2' : 't1';
const heatTxt = h => h===3 ? '热度 高' : h===2 ? '热度 中' : '热度 低';
const btnCls  = r => r===3 ? 'dan' : (r===2 ? '' : 'pri');

function toast(msg, warn){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (warn ? ' warn' : '');
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.className='toast'; }, 2100);
}

function resetAll(){
  DATA = SEED.map(d => Object.assign({}, d, {
    status:'pending', aiRounds:0, aiLog: d.first ? [Object.assign({}, d.first)] : [],
    assigned:null, record:'', startedAt:null, timeout:false, draft:''
  }));
  cur = null; filter='all'; todayFollow=[]; takeovers=0;
  if(timer){clearInterval(timer); timer=null;}
  buildFilter();
  renderAll();
  $('#main').innerHTML = '<div class="empty"><b>从左侧队列选一条私信</b><div>夜间私信自动流入，不需要任何人录单</div></div>';
  $('#cWho').textContent = '未选择消息';
  $('#cMeta').textContent = '';
  $('#result').innerHTML = '<div class="empty"><b>处置结果会出现在这里</b><div>五个字段：风险级别 / 是否已停 / 谁接手 / 建议动作 / 下一步</div></div>';
  $('#rHead').textContent = '待处理';
  toast('已重置为初始演示状态');
}

/* ============ 渲染队列 ============ */
function renderAll(){
  renderQueue();
  const pend = DATA.filter(d=>d.status==='pending');
  $('#sTodo').textContent = pend.length;
  $('#sHigh').textContent = pend.filter(d=>d.risk===3).length;
  $('#sFollow').textContent = todayFollow.length;
  $('#qcount').textContent = pend.length + ' 条待处理';
}

function renderQueue(){
  const box = $('#queue');
  let list = DATA.filter(d => d.status==='pending');
  if(filter!=='all'){
    if(filter==='high') list = list.filter(d=>d.risk===3);
    else if(filter==='hot') list = list.filter(d=>d.heat===3);
    else list = list.filter(d=>d.plat===filter);
  }
  list.sort((a,b)=> b.risk-a.risk || b.heat-a.heat || a.time.localeCompare(b.time));

  // 已处置的排在后面淡显
  const done = DATA.filter(d=>d.status!=='pending');

  let h = '';
  const curItem = cur ? DATA.find(x=>x.id===cur) : null;
  if(curItem && curItem.status!=='pending'){
    const lab = curItem.status==='follow' ? '已进今日跟进' : curItem.status==='arch' ? '已归档' : '处置中';
    h += `<div class="card ${curItem.risk===3?'hi':curItem.risk===2?'mid':''} on" style="border-style:dashed">
      <div class="r1"><span>${curItem.who}</span><span class="badge ${curItem.status==='follow'?'g':'o'}">${lab}</span></div>
      <div class="r2">${curItem.text}</div>
      <div class="r3"><span class="tg ${riskCls(curItem.risk)}">${riskTxt(curItem.risk)}</span>
        <span class="tg t4">${curItem.intent}</span></div>
    </div>`;
  }
  if(!list.length){
    h += '<div style="padding:22px 8px;text-align:center;color:#A6ADB1;font-size:12px">这个筛选下没有待处理消息</div>';
  }
  list.forEach(d=>{
    const cls = d.risk===3?'hi':d.risk===2?'mid':'';
    h += `<div class="card ${cls} ${cur===d.id?'on':''}" onclick="pick('${d.id}')">
      <div class="r1"><span>${d.who}</span><span class="tm">${d.time} · ${d.plat}</span></div>
      <div class="r2">${d.text}</div>
      <div class="r3">
        <span class="tg ${riskCls(d.risk)}">${riskTxt(d.risk)}</span>
        <span class="tg t4">${heatTxt(d.heat)}</span>
        <span class="tg t4">${d.intent}</span>
      </div>
    </div>`;
  });
  if(done.length){
    const others = done.filter(d=>d.id!==cur);
    if(others.length){
      h += '<div style="font-size:10px;letter-spacing:1px;color:#A6ADB1;margin:10px 0 6px 3px">已处置 · ' + others.length + ' 条</div>';
      others.forEach(d=>{
        const lab = d.status==='follow' ? '已进今日跟进' : d.status==='arch' ? '已归档' : '人工接管中';
        h += `<div class="card done" onclick="showDone('${d.id}')">
          <div class="r1"><span>${d.who}</span><span class="badge ${d.status==='follow'?'g':'o'}">${lab}</span></div>
          <div class="r2">${d.text}</div>
        </div>`;
      });
    }
  }
  box.innerHTML = h;
}

function setFilter(f, el){
  filter = f;
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  renderQueue();
}

function buildFilter(){
  const opts = [['all','全部'],['high','只看高危'],['hot','只看高热度'],
                ['微信','微信'],['小红书','小红书'],['抖音','抖音']];
  $('#filt').innerHTML = opts.map(([k,v],i)=>
    `<button class="f ${i===0?'on':''}" onclick="setFilter('${k}',this)">${v}</button>`).join('');
}

/* ============ 选中一条 ============ */
function showDone(id){
  cur = id;
  const d = DATA.find(x=>x.id===id);
  if(!d) return;
  renderQueue();
  $('#cWho').innerHTML = d.who + '<span>' + d.plat + ' · ' + d.time + ' · ' + d.id + '</span>';
  $('#cMeta').textContent = d.status==='arch' ? '已归档' : d.status==='follow' ? '已加入今日跟进' : '人工接管中';
  renderMain(d);
  renderResult(d);
}

function pick(id){
  cur = id;
  const d = DATA.find(x=>x.id===id);
  if(!d || d.status!=='pending'){ showDone(id); return; }
  renderQueue();
  $('#cWho').innerHTML = d.who + '<span>' + d.plat + ' · ' + d.time + ' · ' + d.id + '</span>';
  $('#cMeta').textContent = 'AI 已 3 秒首响';
  renderMain(d);
  renderResult(d);
}

function renderMain(d){
  const taken = d.status==='human' || d.status==='follow' || d.status==='arch';
  let h = '';

  h += `<div class="tagrow">
          <span style="font-size:10.5px;letter-spacing:1px;color:#A6ADB1;margin-right:2px">AI 初判</span>
          <span class="tg ${riskCls(d.risk)}">${riskTxt(d.risk)}</span>
          <span class="tg ${d.heat===3?'t2':'t4'}">${heatTxt(d.heat)}</span>
          <span class="tg t4">意图 · ${d.intent}</span>
        </div>
        <div class="basis"><b>判断依据</b>　${d.basis}</div>`;

  // 会话记录：家长在左，AI 在右（企微里我们这边是绿的）
  h += '<div class="conv"><div class="clb"><span>会话记录</span><span class="cn">' +
       (d.aiLog.length + 1) + ' 条</span></div>';

  h += `<div class="msg in">
     <div class="mh">${d.who}<span>${d.time} · ${d.plat}</span></div>
     <div class="mb">${d.text}</div></div>`;

  d.aiLog.forEach((m,i)=>{
    const n = i===0 ? '3 秒首响' : ('第 ' + i + ' 轮');
    h += `<div class="msg out">
      <div class="mh"><b>AI 自动回复</b><span>${n} · ${m.at||''}</span></div>
      <div class="mb">${m.t}</div>
      <div class="msrc" onclick="toggleKb(this)">依据：${m.src}　<span class="ar">查看切片 ▾</span>
        <div class="knest">${m.src}</div></div>
    </div>`;
  });

  if(d.aiRounds>=2) h += `<div class="sysline">已达 2 轮上限 · 系统已禁止 AI 继续应答，必须转人工</div>`;
  if(d.status==='human') h += `<div class="sysline red">已停止自动应答 · 由${d.assigned}接手</div>`;
  if(d.status==='follow') h += `<div class="sysline grn">邀约已发出 · 已加入今日跟进</div>`;
  if(d.status==='arch') h += `<div class="sysline gry">已归档 · 全程留痕</div>`;
  h += '</div>';

  // 知识库切片（默认收起）
  h += `<div class="kbtog" onclick="toggleKbAll(this)">知识库依据 · ${d.kb.length} 条切片　<span class="ar">展开 ▾</span>
    <div class="kball">` +
    d.kb.map(k=>`<div class="kbi"><div class="kbn">${k.n}</div><div class="kbs">${k.s}</div></div>`).join('') +
    `</div></div>`;

  if(!taken){
    h += `<div class="btnrow" style="margin-top:11px">
      <button class="btn dan" onclick="takeover()">接管（人接）</button>
      <button class="btn" onclick="aiMore()" ${(d.aiRounds>=2||d.risk===3)?'disabled':''}>AI 继续答${d.risk===3?'（已停应答）':(d.aiRounds>=2?'（已 2 轮）':'')}</button>
      <button class="btn pri" onclick="genDraft()">生成邀约</button>
    </div>`;
    h += `<div class="hint">v1 只有这三个动作。按钮多于三个，一线就开始乱点，出事也查不出点了哪个。</div>`;
  }else{
    if(d.status==='arch'){
      h += `<div class="rec"><div class="lb"><span>处置记录 · 已归档留痕</span><em>只读</em></div>
        <div style="border:1px solid #E9ECE8;background:#FAFAF7;border-radius:4px;padding:9px 11px;font-size:12.5px;line-height:1.6;color:#4A5459">${d.record||'（未填）'}</div>
        <div class="hint">归档后不可改：改动要另起一条处置记录。</div></div>`;
    }else{
      h += `<div class="rec">
      <div class="lb"><span>处置记录 · 必填才能归档</span><em>${d.record.length?'已填 '+d.record.length+' 字':'未填'}</em></div>
      <textarea rows="3" id="recBox" placeholder="例：已电话回访，家长确认孩子在家、情绪稳定，约定周三到店，未推课"
        oninput="onRecord(this.value)">${d.record}</textarea>
      <div class="hint">不填不算处理完——这是留痕，不是备注。</div>
    </div>`;
    }
  }
  $('#main').innerHTML = h;
  $('#main').scrollTop = 0;
}

function toggleKb(el){
  el.classList.toggle('open');
  const ar = el.querySelector('.ar');
  ar.textContent = el.classList.contains('open') ? '收起 ▴' : '查看切片 ▾';
}
function toggleKbAll(el){
  el.classList.toggle('open');
  const ar = el.querySelector(':scope > .ar');
  if(ar) ar.textContent = el.classList.contains('open') ? '收起 ▴' : '展开 ▾';
}

/* ============ 三个动作 ============ */
function takeover(){
  const d = DATA.find(x=>x.id===cur); if(!d) return;
  d.status='human'; d.assigned = d.risk===3 ? '组长 小彤' : '客服 小林';
  d.startedAt = Date.now(); d.timeout=false;
  takeovers++;
  renderAll(); renderMain(d); renderResult(d);
  toast('已停止自动应答，' + d.assigned + ' 接手 · 5 分钟倒计时开始');
  startTimer();
}

async function aiMore(){
  const d = DATA.find(x=>x.id===cur); if(!d) return;
  if(d.risk===3){ toast('风险 3 级：已停自动应答，AI 不许再答', true); return; }
  if(d.aiRounds>=2){ toast('已到 2 轮上限，必须转人', true); return; }

  // 如果有预设回复，使用预设（兼容旧数据）
  const next = d.more[d.aiRounds];
  if(next){
    d.aiRounds++;
    d.aiLog.push(Object.assign({}, next));
    renderAll(); renderMain(d); renderResult(d, true);
    if(d.aiRounds===2){
      toast('已到 2 轮上限 —— 下一句必须转人，不能无限陪聊', true);
    }else{
      toast('AI 已回复（第 ' + d.aiRounds + ' / 2 轮）');
    }
    return;
  }

  // 否则调用真实 API
  toast('AI 正在生成回复...');
  try {
    // 构建对话历史
    const history = [];
    history.push({ role: 'user', content: d.text });
    d.aiLog.forEach((log, i) => {
      history.push({ role: 'assistant', content: log.t });
    });

    // 模拟用户追问（这里简化处理，实际应该让用户输入）
    const followUp = '（用户追问，等待回复）';

    const response = await fetch(`${API_BASE}/api/continue`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: followUp,
        history: history,
        intent: d.intent,
        kb_items: d.kb
      })
    });

    if (!response.ok) {
      throw new Error('API 调用失败');
    }

    const result = await response.json();
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                    now.getMinutes().toString().padStart(2, '0');

    d.aiRounds++;
    d.aiLog.push({
      t: result.response,
      src: result.kb_source,
      at: timeStr
    });

    renderAll(); renderMain(d); renderResult(d, true);

    if(d.aiRounds===2){
      toast('已到 2 轮上限 —— 下一句必须转人，不能无限陪聊', true);
    }else{
      toast('AI 已回复（第 ' + d.aiRounds + ' / 2 轮）');
    }

  } catch (error) {
    toast('AI 回复失败：' + error.message + '（请确认后端服务已启动）', true);
    console.error(error);
  }
}


function genDraft(){
  const d = DATA.find(x=>x.id===cur); if(!d) return;
  const map = {
    '求方案':'李女士你好，我是启航的顾问。看到你昨晚的消息，今天上午想先跟你通个电话，先了解孩子现在的情况，不谈课程。方便的话你回个时间，我按你的时间来。',
    '问价格':'王先生你好，初二一对一标准价 3,980 / 期，周末有试听。我给你留了周六上午 10 点的位置，你看合适吗？',
    '抱怨/退费':'你的情况我记下了，组长今天会亲自跟你核实，具体怎么处理以组长答复为准。',
    '问课程':'张女士你好，五年级专注力课每周六上午，小班 6 人，可以先带孩子来试听一节课。',
    '随口问':'我们在杭州有 3 个校区，最近的是滨江校区，地址我发你。',
    '医疗越界':'这个问题需要专业医生判断，我们不能给结论。我已经请老师直接联系你。'
  };
  d.draft = map[d.intent] || '（草稿）';
  renderResult(d, true);
  toast('已生成话术草稿 —— 顾问可改可拒，发出前必须自己读一遍');
}

function sendDraft(){
  const d = DATA.find(x=>x.id===cur); if(!d) return;
  if(d.risk===3 && d.status==='pending'){
    toast('风险 3 级必须先接管，不允许直接发邀约', true);
    return;
  }
  const box = document.getElementById('draftBox');
  if(box) d.draft = box.value;
  d.status='follow'; d.assigned = d.assigned || '顾问 小周';
  todayFollow.push(d.id);
  renderAll(); renderMain(d); renderResult(d);
  toast('邀约已发出 · 已加入今日跟进（' + todayFollow.length + ' 条）');
}

function archiveIt(){
  const d = DATA.find(x=>x.id===cur); if(!d) return;
  if((d.record||'').trim().length < 4){ toast('处置记录没填，不能归档', true); return; }
  d.status='arch';
  renderAll(); renderMain(d); renderResult(d);
  toast('已归档 · 全程留痕可回溯');
}

function onRecord(v){
  const d = DATA.find(x=>x.id===cur); if(!d) return;
  d.record = v;
  const lb = document.querySelector('.rec .lb em');
  if(lb) lb.textContent = v.length ? ('已填 ' + v.length + ' 字') : '未填';
  const b = document.getElementById('archBtn');
  if(b) b.disabled = v.trim().length < 4;
}

/* ============ 结果区 ============ */
function renderResult(d, keepScroll){
  const R = $('#result');
  $('#rHead').textContent = d.status==='pending' ? '待处理' : d.status==='human' ? '人工接管中' : d.status==='follow' ? '已发出' : '已归档';
  let h = '<div class="res">';

  if(d.status==='pending'){
    const stopped = d.risk===3;
    h += `<div class="banner ${stopped?'red':'gry'}">${stopped
        ? '风险 3 级 · AI 已首响并立即停应答'
        : 'AI 已自动首响，等待处置'}<br><span style="font-size:11.5px">${stopped
        ? '已转人工，' + (d.timeout?'超时兜底已触发':'等待组长接手')
        : (d.aiRounds>=2 ? '已对话 2 轮 · 已达上限，必须转人' : (d.aiRounds?'已对话 '+d.aiRounds+' 轮 · 可继续也可转人':'尚未转人'))}</span></div>`;
    h += field('风险级别', `<span class="tg ${riskCls(d.risk)}">${riskTxt(d.risk)}</span>`);
    h += field('是否已停自动应答', stopped
        ? '<b style="color:#A5351F">是 · 危机命中即停，AI 不再应答</b>'
        : (d.aiRounds>=2 ? '<b style="color:#A5351F">已达 2 轮上限，下一句必须转人</b>' : '否 · AI 仍在应答'));
    h += field('AI 已发内容', `已首响 1 条${d.aiRounds?' + 追加 '+d.aiRounds+' 条':''}，共 ${d.aiLog.length} 条 · 每条带出处`);
    h += field('谁接手', '—', true);
    h += field('建议动作', d.advice);
    h += `<button class="btn pri wide" onclick="takeover()">接管并处置</button>`;
    if(d.draft){
      h += `<div class="field"><div class="k">话术草稿 · 顾问可改可拒</div>
        <textarea rows="4" id="draftBox">${d.draft}</textarea>
        <div class="btnrow" style="margin:8px 0 0">
          <button class="btn" onclick="genDraft()">重新生成</button>
          <button class="btn pri" onclick="sendDraft()">发出并加入今日跟进</button>
        </div></div>`;
    }
    h += `<div class="small">接管后这一栏会变成：红横幅 → 倒计时 → 五个字段 → 下一步按钮。</div>`;
  }

  if(d.status==='human'){
    h += `<div class="banner red">${riskTxt(d.risk)} · 已停自动应答 · ${d.assigned} 接手</div>`;

    // 倒计时
    const left = Math.max(0, 300 - Math.floor((Date.now()-(d.startedAt||Date.now()))/1000));
    h += `<div class="field"><div class="k">兜底倒计时 · 5 分钟无人处置则自动升级</div>
          <div class="cdrow"><div class="cd ${left<=60?'hot':''}" id="cdTxt">${fmt(left)}</div>
          <button class="btn wide" style="padding:6px 10px;font-size:11.5px" onclick="forceTimeout()">模拟超时</button></div>
          <div class="small">超时 → @组长 → 电话呼叫校长 → 全程留痕</div></div>`;
    if(d.timeout){
      h += `<div class="banner red" style="font-size:11.5px">已触发超时兜底：@组长 → 电话呼叫校长</div>`;
    }

    h += field('建议动作', d.advice);
    h += `<div class="field"><div class="k">话术草稿 · 顾问可改可拒</div>
      <textarea rows="4" id="draftBox">${d.draft || ''}</textarea>
      <div class="btnrow" style="margin:8px 0 0">
        <button class="btn" onclick="genDraft()">重新生成</button>
        <button class="btn pri" onclick="sendDraft()">发出并加入今日跟进</button>
      </div></div>`;
    h += `<div class="field"><div class="k">下一步</div>
      <div class="btnrow" style="margin:2px 0 0">
        <button class="btn" onclick="archiveIt()" id="archBtn" ${((d.record||'').trim().length<4)?'disabled':''}>归档</button>
      </div>
      <div class="small" style="margin-top:6px">归档前必须先填处置记录</div></div>`;
  }

  if(d.status==='follow'){
    h += `<div class="banner grn">邀约已发出 · 已加入今日跟进</div>`;
    h += field('风险级别', `<span class="tg ${riskCls(d.risk)}">${riskTxt(d.risk)}</span>`);
    h += field('谁接手', d.assigned || '顾问');
    h += field('处置记录', d.record || '（未填）', !d.record);
    h += `<div class="field"><div class="k">下一步</div>
      <div class="btnrow" style="margin:2px 0 0"><button class="btn" onclick="archiveIt()" id="archBtn"
        ${((d.record||'').trim().length<4)?'disabled':''}>归档</button></div></div>`;
  }

  if(d.status==='arch'){
    h += `<div class="banner grn">已归档 · 全程留痕</div>`;
    h += field('风险级别', `<span class="tg ${riskCls(d.risk)}">${riskTxt(d.risk)}</span>`);
    h += field('谁接手', d.assigned || '—');
    h += field('处置记录', d.record || '（未填）');
    h += `<div class="kpirow">
      <div class="kpi"><div class="kk">本轮接手</div><div class="vv">${takeovers}<small> 条</small></div></div>
      <div class="kpi"><div class="kk">今日跟进</div><div class="vv">${todayFollow.length}<small> 条</small></div></div>
    </div>`;
  }

  h += '</div>';
  R.innerHTML = h;
  if(!keepScroll) R.scrollTop = 0;
}

function field(k, v, dim){
  return `<div class="field ${dim?'dim':''}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
}
function fmt(s){ const m = String(Math.floor(s/60)).padStart(2,'0'); const x = String(s%60).padStart(2,'0'); return m+':'+x; }

function forceTimeout(){
  const d = DATA.find(x=>x.id===cur); if(!d) return;
  d.startedAt = Date.now() - 300*1000; d.timeout = true;
  renderResult(d, true);
  toast('超时兜底已触发：@组长 → 电话呼叫校长', true);
}

function startTimer(){
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{
    const d = DATA.find(x=>x.id===cur);
    if(!d || d.status!=='human'){ clearInterval(timer); timer=null; return; }
    const el = document.getElementById('cdTxt');
    if(!el){ clearInterval(timer); timer=null; return; }
    const left = Math.max(0, 300 - Math.floor((Date.now()-d.startedAt)/1000));
    el.textContent = fmt(left);
    el.className = 'cd' + (left<=60?' hot':'');
    if(left===0 && !d.timeout){ d.timeout=true; toast('5 分钟到，已自动升级到组长与校长', true); renderResult(d, true); }
  }, 1000);
}

/* ============ 启动 ============ */
buildFilter();
resetAll();

/* ============ 监听模拟器消息 ============ */
// 从 localStorage 读取模拟器发送的消息
function loadSimulatorMessages() {
  try {
    const messages = JSON.parse(localStorage.getItem('qihang_simulator_messages') || '[]');
    if (messages.length > 0) {
      // 合并到 DATA
      messages.forEach(msg => {
        // 检查是否已存在
        if (!DATA.find(d => d.id === msg.id)) {
          DATA.unshift(msg);  // 新消息放最前面
        }
      });
      // 清空 localStorage
      localStorage.removeItem('qihang_simulator_messages');
      renderAll();
      toast('已加载 ' + messages.length + ' 条新消息');
    }
  } catch (e) {
    console.error('加载模拟器消息失败:', e);
  }
}

// 监听 postMessage（如果模拟器和原型在不同窗口）
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'NEW_MESSAGE') {
    const msg = event.data.message;
    if (!DATA.find(d => d.id === msg.id)) {
      DATA.unshift(msg);
      renderAll();
      toast('收到新消息：' + msg.who);
      // 自动选中新消息
      setTimeout(() => pick(msg.id), 300);
    }
  }
});

// 页面加载时检查一次
loadSimulatorMessages();

// 每 2 秒检查一次（如果模拟器在另一个标签页）
setInterval(loadSimulatorMessages, 2000);

/* 截图/演示用：
   #showcase       → 选中「问价格」单，跑满 2 轮，展开知识库切片（展示 AI 回答内容）
   #showcase-risk  → 选中高危单并接管（展示危机首响 + 停应答）*/
if(location.hash === '#showcase'){
  setTimeout(()=>{
    const t = DATA.find(d=>d.id==='M-2468');
    if(t){
      pick(t.id);
      aiMore(); aiMore();
      cur = t.id; renderMain(t);
      const kb = document.querySelector('#main .kbtog'); if(kb) toggleKbAll(kb);
      document.querySelector('#main').scrollTop = 0;
    }
  }, 60);
}
if(location.hash === '#showcase-risk'){
  setTimeout(()=>{
    const first = DATA.filter(d=>d.risk===3)[0];
    if(first){ pick(first.id); takeover(); }
  }, 60);
}
</script>
