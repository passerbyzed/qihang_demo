<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>启航 AI 原型 - 技术架构图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#F7F4EF;font-family:"Microsoft YaHei",sans-serif;padding:40px;
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  .canvas{background:#fff;border-radius:12px;padding:40px;box-shadow:0 10px 40px rgba(0,0,0,.08);
          max-width:1000px}
  h1{font-size:28px;font-weight:700;color:#1F2421;margin-bottom:8px;text-align:center}
  .sub{text-align:center;color:#5C635D;font-size:14px;margin-bottom:32px}

  svg{display:block;margin:0 auto}
  .layer{fill:#FBF9F5;stroke:#E7E1D7;stroke-width:2;rx:8}
  .box{fill:#fff;stroke:#DDE1DC;stroke-width:1.5;rx:6}
  .arrow{stroke:#C4612F;stroke-width:2.5;fill:none;marker-end:url(#arrowhead)}
  .label{fill:#1F2421;font-size:14px;font-weight:500}
  .desc{fill:#5C635D;font-size:11px}
  .tech{fill:#8A9296;font-size:10px;font-style:italic}
  .title{fill:#C4612F;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="canvas">
  <h1>启航家庭教育 · 夜间私信 AI 原型</h1>
  <div class="sub">技术架构 v1.0 - 接入 DeepSeek API 实现意图识别与首响生成</div>

  <svg width="920" height="580" viewBox="0 0 920 580">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#C4612F"/>
      </marker>
    </defs>

    <!-- 四层架构 -->
    <rect class="layer" x="20" y="20" width="880" height="100"/>
    <text class="title" x="40" y="50">① 入口层</text>
    <text class="desc" x="40" y="70">多平台私信统一流入</text>

    <rect class="layer" x="20" y="140" width="880" height="140"/>
    <text class="title" x="40" y="170">② 应用层</text>
    <text class="desc" x="40" y="190">原型界面 + 模拟器</text>

    <rect class="layer" x="20" y="300" width="880" height="120"/>
    <text class="title" x="40" y="330">③ 模型层</text>
    <text class="desc" x="40" y="350">DeepSeek API 分析引擎</text>

    <rect class="layer" x="20" y="440" width="880" height="120"/>
    <text class="title" x="40" y="470">④ 数据层</text>
    <text class="desc" x="40" y="490">知识库 + 危机规则</text>

    <!-- 入口层内容 -->
    <rect class="box" x="140" y="40" width="100" height="60"/>
    <text class="label" x="190" y="67" text-anchor="middle">微信</text>
    <text class="tech" x="190" y="85" text-anchor="middle">企业微信</text>

    <rect class="box" x="260" y="40" width="100" height="60"/>
    <text class="label" x="310" y="67" text-anchor="middle">小红书</text>
    <text class="tech" x="310" y="85" text-anchor="middle">私信 API</text>

    <rect class="box" x="380" y="40" width="100" height="60"/>
    <text class="label" x="430" y="67" text-anchor="middle">抖音</text>
    <text class="tech" x="430" y="85" text-anchor="middle">飞书</text>

    <rect class="box" x="500" y="40" width="100" height="60"/>
    <text class="label" x="550" y="67" text-anchor="middle">知乎</text>
    <text class="tech" x="550" y="85" text-anchor="middle">待接入</text>

    <!-- 应用层内容 -->
    <rect class="box" x="140" y="170" width="200" height="90"/>
    <text class="label" x="240" y="200" text-anchor="middle">模拟器</text>
    <text class="desc" x="240" y="220" text-anchor="middle">simulator.html</text>
    <text class="tech" x="240" y="235" text-anchor="middle">输入消息 → 调用 API</text>
    <text class="tech" x="240" y="250" text-anchor="middle">→ 传递给原型</text>

    <rect class="box" x="380" y="170" width="220" height="90"/>
    <text class="label" x="490" y="200" text-anchor="middle">原型界面</text>
    <text class="desc" x="490" y="220" text-anchor="middle">pm02-prototype-demo.html</text>
    <text class="tech" x="490" y="235" text-anchor="middle">队列展示 + 三个操作</text>
    <text class="tech" x="490" y="250" text-anchor="middle">接管 / AI 继续答 / 生成邀约</text>

    <rect class="box" x="640" y="170" width="180" height="90"/>
    <text class="label" x="730" y="200" text-anchor="middle">后端服务</text>
    <text class="desc" x="730" y="220" text-anchor="middle">app.py (Flask)</text>
    <text class="tech" x="730" y="235" text-anchor="middle">/api/analyze</text>
    <text class="tech" x="730" y="250" text-anchor="middle">/api/continue</text>

    <!-- 模型层内容 -->
    <rect class="box" x="140" y="320" width="150" height="80"/>
    <text class="label" x="215" y="350" text-anchor="middle">意图识别</text>
    <text class="tech" x="215" y="370" text-anchor="middle">关键词匹配</text>
    <text class="tech" x="215" y="385" text-anchor="middle">6 类意图</text>

    <rect class="box" x="310" y="320" width="150" height="80"/>
    <text class="label" x="385" y="350" text-anchor="middle">风险分级</text>
    <text class="tech" x="385" y="370" text-anchor="middle">危机词检测</text>
    <text class="tech" x="385" y="385" text-anchor="middle">1/2/3 级</text>

    <rect class="box" x="480" y="320" width="150" height="80"/>
    <text class="label" x="555" y="350" text-anchor="middle">知识检索</text>
    <text class="tech" x="555" y="370" text-anchor="middle">关键词匹配</text>
    <text class="tech" x="555" y="385" text-anchor="middle">Top-3 条目</text>

    <rect class="box" x="650" y="320" width="170" height="80"/>
    <text class="label" x="735" y="345" text-anchor="middle">DeepSeek API</text>
    <text class="desc" x="735" y="365" text-anchor="middle">deepseek-chat</text>
    <text class="tech" x="735" y="380" text-anchor="middle">生成首响 + 追加回复</text>
    <text class="tech" x="735" y="395" text-anchor="middle">temperature=0.3</text>

    <!-- 数据层内容 -->
    <rect class="box" x="140" y="460" width="320" height="80"/>
    <text class="label" x="300" y="490" text-anchor="middle">知识库</text>
    <text class="desc" x="300" y="510" text-anchor="middle">knowledge_base.json</text>
    <text class="tech" x="300" y="525" text-anchor="middle">12 条知识库条目（危机话术/FAQ/价格/课程）</text>

    <rect class="box" x="480" y="460" width="340" height="80"/>
    <text class="label" x="650" y="490" text-anchor="middle">规则配置</text>
    <text class="desc" x="650" y="510" text-anchor="middle">危机关键词 + 意图匹配规则</text>
    <text class="tech" x="650" y="525" text-anchor="middle">自伤 8 词 / 暴力 4 词 / 医疗 8 词</text>

    <!-- 箭头 -->
    <path class="arrow" d="M 240 100 L 240 170"/>
    <path class="arrow" d="M 490 100 L 490 170"/>

    <path class="arrow" d="M 240 260 L 490 260 L 490 280 L 730 280"/>
    <path class="arrow" d="M 600 260 L 730 260"/>

    <path class="arrow" d="M 730 280 L 730 320"/>

    <path class="arrow" d="M 215 400 L 215 460"/>
    <path class="arrow" d="M 555 400 L 555 440 L 300 440 L 300 460"/>
    <path class="arrow" d="M 735 400 L 735 440 L 650 440 L 650 460"/>

    <!-- 标注 -->
    <text class="tech" x="245" y="135" fill="#C4612F">模拟输入</text>
    <text class="tech" x="495" y="135" fill="#C4612F">接收消息</text>
    <text class="tech" x="660" y="275" fill="#C4612F">POST请求</text>
    <text class="tech" x="740" y="310" fill="#C4612F">调用模型</text>
  </svg>

  <div style="margin-top:32px;padding:20px;background:#F2E3D6;border-radius:8px;border-left:4px solid #C4612F">
    <div style="font-size:13px;color:#5C635D;line-height:1.8">
      <strong style="color:#1F2421">核心流程：</strong><br>
      1. 模拟器输入消息 → POST 到 Flask 后端<br>
      2. 后端检测危机词 → 意图分类 → 检索知识库 → 调用 DeepSeek 生成首响<br>
      3. 返回分析结果（意图/风险/热度/首响内容/知识库依据）<br>
      4. 原型接收消息并渲染到队列，用户可选择"接管"或"AI 继续答"
    </div>
  </div>
</div>
</body>
</html>
